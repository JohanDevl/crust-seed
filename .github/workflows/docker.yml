name: Build and publish Docker image

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch when a new
# push lands — avoids stacking multi-minute builds during back-to-back pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Quality gate: the image is only published when fmt, clippy and the full
  # test suite are green. PRs run the same steps via ci.yml.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # contents: write is needed by the release step (tag push + gh release)
      # on the main branch; harmless for develop builds.
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(awk -F'"' '/^version *= *"/{print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not parse version from Cargo.toml"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

      - name: Compute image tags
        id: tags
        run: |
          REPO_LC="${IMAGE_NAME,,}"  # GHCR rejects uppercase in image name
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"

          tags=()
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # SemVer convention: prefix the version with "v" (matches git tag style).
            tags+=("$REGISTRY/$REPO_LC:v${{ steps.version.outputs.value }}")
            tags+=("$REGISTRY/$REPO_LC:latest")
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            tags+=("$REGISTRY/$REPO_LC:develop")
          else
            tags+=("$REGISTRY/$REPO_LC:${GITHUB_REF_NAME//\//-}")
          fi

          {
            echo "list<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Tags to publish:"
          printf '  %s\n' "${tags[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          platforms: linux/amd64
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_VERSION=${{ steps.version.outputs.value }}
          # GHA cache for the BuildKit layer cache. cargo-chef + cache mounts
          # inside the Dockerfile complete the picture: deps cached separately
          # from source, registry / target cached across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance=false avoids the extra OCI image-index manifest that
          # confuses some pull paths (e.g. `docker compose pull` < 2.20).
          provenance: false

      # Durable provenance for main builds: without this the floating GHCR tag
      # is the ONLY artifact mapping a running vX.Y.Z image back to a commit —
      # no git tag, no release notes, no rollback anchor. Idempotent: a version
      # that is already tagged (Cargo.toml not bumped) is skipped, so pushes to
      # main without a version bump stay release-less by design.
      - name: Create git tag + GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists — skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Image: \`${{ env.REGISTRY }}/${{ steps.tags.outputs.repo_lc }}:$VERSION\`"

      - name: Summary
        run: |
          {
            echo "## Docker image published"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Cargo version:** \`${{ steps.version.outputs.value }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
            echo ""
            echo "Pull with:"
            echo '```bash'
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "docker pull ${{ env.REGISTRY }}/${{ steps.tags.outputs.repo_lc }}:latest"
              echo "docker pull ${{ env.REGISTRY }}/${{ steps.tags.outputs.repo_lc }}:v${{ steps.version.outputs.value }}"
            else
              echo "docker pull ${{ env.REGISTRY }}/${{ steps.tags.outputs.repo_lc }}:develop"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
